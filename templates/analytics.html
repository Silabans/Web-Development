<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Analytics Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="analytics-body">
    <header class="analytics-header">
        <div class="analytics-container">
            <h1>Productivity Analytics</h1>
            <p>Track your deep work metrics and trends</p>
        </div>
        <a href="{{ url_for('dashboard') }}" class="'btn-back">Back to Dashboard</a>
    </header>

    <main class="analytics-main">
        <section class="metrics-grid">
            <div class="card">
                <h3>Total Tasks</h3>
                <span class="metrics" id="metric-total">--</span>
            </div>
            <div class="card">
                <h3>Tasks Completed</h3>
                <span class="metrics" id="metric-completed">--</span>
            </div>
            <div class="card">
                <h3>Completion Rate</h3>
                <span class="metrics" id="metric-rate">--</span>
            </div>
        </section>

        <section class="charts-container">
            <div class="chart-box">
                <h3>All Tasks by Priority</h3>
                <div class="canvas-wrapper">
                    <canvas id="priorityChart"></canvas>
                </div>
            </div>

            <div class="chart-box">
                <h3>Completed Tasks by Priority</h3>
                <div class="piechart-wrapper">
                    <canvas id="completedChart"></canvas>
                </div>
            </div>
        </section>
    </main>
    

    <script src="{{ url_for('static', filename='analytics.js') }}"></script>
</body>
</html>
